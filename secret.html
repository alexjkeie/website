<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rețea Secretă — lpsec</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="glass-panel" style="padding:1.2rem;margin-top:2rem;">
        <h1>Acces rețea secretă</h1>
        <div id="secretBody">Se verifică permisiunile...</div>
      </div>
    </main>
    <script>
      async function qs(k){ return new URLSearchParams(location.search).get(k); }
      (async ()=>{
        const id = await qs('id'); const token = await qs('token');
        if (!id || !token) { document.getElementById('secretBody').textContent='Acces invalid.'; return; }
        try{
          const res = await fetch(`/api/validate-access?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`);
          const j = await res.json();
          if (j.ok) {
            document.getElementById('secretBody').innerHTML = `<p>Bine ai venit, <strong>${j.name}</strong>.</p><p>Aici este pagina privată a rețelei lpsec.</p><p>Linkuri interne: <a href="#">Tab 1</a> • <a href="#">Tab 2</a></p>`;
          } else {
            document.getElementById('secretBody').textContent = 'Acces refuzat: ' + (j.error||'');
          }
        } catch (e) { document.getElementById('secretBody').textContent='Eroare rețea.'; }
      })();
    </script>
  </body>
</html>
