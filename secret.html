<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rețea Secretă — lpsec</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="glass-panel" style="padding:1.2rem;margin-top:2rem;">
        <h1>Acces rețea secretă</h1>
        <div id="secretBody">Se verifică permisiunile...</div>
      </div>
    </main>
    <script>
      async function qs(k){ return new URLSearchParams(location.search).get(k); }
      (async ()=>{
        const id = await qs('id'); const token = await qs('token');
        if (!id || !token) { document.getElementById('secretBody').textContent='Acces invalid.'; return; }
        try{
          const res = await fetch(`/api/validate-access?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`);
          const j = await res.json();
          if (j.ok) {
            document.getElementById('secretBody').innerHTML = `
              <p>Bine ai venit, <strong>${j.name}</strong>.</p>
              <div style="margin-top:12px">
                <h3>Panou membru</h3>
                <div style="display:flex;gap:0.6rem;margin-bottom:0.8rem">
                  <input id="postText" placeholder="Scrie un mesaj pentru rețea" style="flex:1;padding:0.6rem;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text)" />
                  <button id="postBtn" class="button">Trimite</button>
                </div>
                <div style="margin-bottom:0.8rem"><button id="refreshPosts" class="button button-secondary">Reîmprospătează mesaje</button> <button id="membersBtn" class="button">Vezi membri</button></div>
                <div id="postsList">Se încarcă mesaje...</div>
                <hr />
                <h4>Note personale</h4>
                <div style="display:flex;gap:0.6rem;margin-bottom:0.6rem"><input id="noteText" placeholder="Note personale" style="flex:1;padding:0.5rem;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text)" /><button id="noteBtn" class="button button-secondary">Salvează</button></div>
                <div id="notesList">Se încarcă note...</div>
              </div>
            `;

            async function loadPosts(){
              const r = await fetch(`/api/member/posts?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`);
              const j = await r.json(); if (!j.ok) { document.getElementById('postsList').textContent='Eroare la mesaje'; return; }
              const out = j.posts.map(p=>`<div class="service-item"><strong>${p.author}${p.admin? ' (ADMIN)' : ''}</strong><div style="color:var(--muted)">${new Date(p.createdAt).toLocaleString()}</div><div style="margin-top:6px">${p.text}</div></div>`).join('');
              document.getElementById('postsList').innerHTML = out || '<div>Nu sunt mesaje.</div>';
            }

            async function loadNotes(){
              const r = await fetch(`/api/member/notes?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`);
              const j = await r.json(); if (!j.ok) { document.getElementById('notesList').textContent='Eroare la note'; return; }
              const out = j.notes.map(n=>`<div class="service-item"><div style="font-size:0.9rem;color:var(--muted)">${new Date(n.createdAt).toLocaleString()}</div><div style="margin-top:6px">${n.note}</div></div>`).join('');
              document.getElementById('notesList').innerHTML = out || '<div>Nu ai note.</div>';
            }

            document.getElementById('postBtn').addEventListener('click', async ()=>{
              const text = document.getElementById('postText').value.trim(); if (!text) return;
              await fetch('/api/member/post',{ method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ id, token, text }) });
              document.getElementById('postText').value=''; loadPosts();
            });
            document.getElementById('refreshPosts').addEventListener('click', loadPosts);
            document.getElementById('noteBtn').addEventListener('click', async ()=>{
              const note = document.getElementById('noteText').value.trim(); if (!note) return;
              await fetch('/api/member/note',{ method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ id, token, note }) });
              document.getElementById('noteText').value=''; loadNotes();
            });
            document.getElementById('membersBtn').addEventListener('click', async ()=>{
              const r = await fetch(`/api/members?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`);
              const j = await r.json(); if (!j.ok) return alert('Eroare');
              alert('Membri:\n' + j.members.map(m=>m.name).join('\n'));
            });

            loadPosts(); loadNotes();
          } else {
            document.getElementById('secretBody').textContent = 'Acces refuzat: ' + (j.error||'');
          }
        } catch (e) { document.getElementById('secretBody').textContent='Eroare rețea.'; }
      })();
    </script>
  </body>
</html>
