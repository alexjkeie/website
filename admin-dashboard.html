<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Panou Admin — lpsec</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <div class="brand"><span class="brand-mark">L</span><span>lpsec</span></div>
        <nav class="nav-links">
          <a href="index.html">Acasă</a>
          <a href="request.html">Solicitare</a>
        </nav>
        <div>
          <button id="logoutBtn" class="button-small">Deconectează</button>
        </div>
      </div>
    </header>

    <main class="container">
      <h1>Panou Administrator</h1>
      <div id="adminInfo" class="glass-panel" style="padding:1rem;margin-bottom:1rem;">
        <strong>Profil:</strong> <span id="adminUser">—</span>
      </div>

      <section>
        <h2>Cereri în așteptare</h2>
        <div id="requestsPanel">Încă se încarcă...</div>
      </section>

      <section>
        <h2>Mesaje rețea</h2>
        <div id="postsPanel">Încă se încarcă mesaje...</div>
      </section>

      <section>
        <h2>Instrumente</h2>
        <div style="display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:0.6rem">
          <button id="exportBtn" class="button button-secondary">Exportă cereri (JSON)</button>
          <button id="sessionsBtn" class="button button-secondary">Vezi sesiuni</button>
          <button id="blacklistBtn" class="button button-secondary">Blacklist IP</button>
          <button id="changePassBtn" class="button">Schimbă parola</button>
        </div>
      </section>
    </main>

    <div id="modal">
      <div class="glass-panel" style="padding:1rem;">
        <div id="modalBody"></div>
        <div style="margin-top:1rem;text-align:right;"><button id="closeModal" class="button button-secondary">Închide</button></div>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      (function(){
        const token = localStorage.getItem('lpsec_admin_token');
        if (!token) { location.href='admin.html'; return; }
        document.getElementById('logoutBtn').addEventListener('click', ()=>{ localStorage.removeItem('lpsec_admin_token'); location.href='admin.html'; });

        async function loadRequests(){
          const r = await fetch('/api/admin/requests', { headers: { 'x-admin-token': token }});
          const j = await r.json();
          const panel = document.getElementById('requestsPanel');
          if (!j.ok) { panel.textContent='Eroare la preluare'; return; }
          panel.innerHTML='';
          j.requests.forEach(req=>{
            const el = document.createElement('div');
            el.className='service-item';
            el.style.display='flex'; el.style.justifyContent='space-between'; el.style.alignItems='center'; el.style.marginBottom='0.6rem';
            el.innerHTML = `<div><strong>${req.name}</strong><div style="font-size:0.9rem;color:var(--muted)">Stare: ${req.status} ${req.accessToken? '(token activ)':''}</div></div>`;
            const actions = document.createElement('div');
            if (req.status==='pending'){
              const a = document.createElement('button'); a.textContent='Aprobă'; a.className='button';
              a.addEventListener('click', async ()=>{ await fetch('/api/admin/approve', { method:'POST', headers:{ 'Content-Type':'application/json','x-admin-token':token }, body: JSON.stringify({ id: req.id }) }); loadRequests(); });
              const rj = document.createElement('button'); rj.textContent='Respinge'; rj.className='button button-secondary';
              rj.addEventListener('click', async ()=>{ await fetch('/api/admin/reject',{ method:'POST', headers:{ 'Content-Type':'application/json','x-admin-token':token }, body: JSON.stringify({ id: req.id }) }); loadRequests(); });
              actions.appendChild(a); actions.appendChild(rj);
            } else if (req.status==='approved'){
              const revoke = document.createElement('button'); revoke.textContent='Revocă'; revoke.className='button button-secondary';
              revoke.addEventListener('click', async ()=>{ await fetch('/api/admin/revoke',{ method:'POST', headers:{ 'Content-Type':'application/json','x-admin-token':token }, body: JSON.stringify({ id: req.id }) }); loadRequests(); });
              actions.appendChild(revoke);
              const open = document.createElement('a'); open.className='button'; open.textContent='Deschide rețea'; open.href=`secret.html?id=${req.id}&token=${req.accessToken||''}`; actions.appendChild(open);
            } else {
              const info = document.createElement('span'); info.textContent='Nicio acțiune'; actions.appendChild(info);
            }
            el.appendChild(actions);
            panel.appendChild(el);
          });
        }

        document.getElementById('exportBtn').addEventListener('click', async ()=>{
          const r = await fetch('/api/admin/export',{ headers:{ 'x-admin-token': token }}); const j = await r.json();
          if (!j.ok) return alert('Eroare export');
          const blob = new Blob([JSON.stringify(j.requests,null,2)],{type:'application/json'});
          const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href=url; a.download='requests.json'; document.body.appendChild(a); a.click(); a.remove();
        });

        // modal helpers
        const modal = document.getElementById('modal');
        const modalBodyEl = document.getElementById('modalBody');
        const closeModalBtn = document.getElementById('closeModal');
        function openModal(content){ modalBodyEl.innerHTML = content; modal.classList.add('open'); }
        function closeModal(){ modal.classList.remove('open'); }
        closeModalBtn.addEventListener('click', closeModal);
        // close when clicking backdrop
        modal.addEventListener('click', (e)=>{ if (e.target === modal) closeModal(); });

        document.getElementById('sessionsBtn').addEventListener('click', async ()=>{
          const r = await fetch('/api/admin/sessions', { headers: { 'x-admin-token': token }});
          const j = await r.json();
          if (!j.ok) return alert('Eroare la preluare sesiuni');
          const body = '<h3>Sesiuni active</h3><div style="max-height:260px;overflow:auto;">' + (j.sessions.length ? j.sessions.map(s=>`<div style="padding:6px;border-bottom:1px solid var(--line)"><strong>${s.user}</strong><div style="font-size:0.9rem;color:var(--muted)">${new Date(s.createdAt).toLocaleString()}</div><div style="font-size:0.8rem;color:var(--muted)">IP: ${s.ip || 'necunos'} / token: ${s.token}</div></div>`).join('') : '<div>Nu sunt sesiuni.</div>') + '</div>';
          openModal(body);
        });

        document.getElementById('blacklistBtn').addEventListener('click', async ()=>{
          const res = await fetch('/api/admin/blacklist', { headers: { 'x-admin-token': token }});
          const j = await res.json();
          if (!j.ok) return alert('Eroare la blacklist');
          const body = `
            <h3>Blacklist IP</h3>
            <div style="display:grid;gap:0.6rem;">
              <input id="blacklistIp" placeholder="IP-ul de blocat" />
              <input id="blacklistReason" placeholder="Motiv" />
              <div style="display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:flex-end">
                <button id="doBlacklist" class="button">Blochează</button>
              </div>
            </div>
            <div style="margin-top:1rem;max-height:220px;overflow:auto;display:grid;gap:0.5rem;">
              ${(j.blacklist || []).length ? (j.blacklist || []).map(item => `
                <div style="padding:0.5rem;border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;gap:1rem;align-items:center;">
                  <div>
                    <strong>${item.ip}</strong>
                    <div style="font-size:0.8rem;color:var(--muted)">${item.reason || 'manual'}</div>
                  </div>
                  <button class="button button-secondary remove-ip" data-ip="${item.ip}">Șterge</button>
                </div>
              `).join('') : '<div>Nu există IP-uri blocate.</div>'}
            </div>
          `;
          openModal(body);
          document.getElementById('doBlacklist').addEventListener('click', async ()=>{
            const ip = document.getElementById('blacklistIp').value.trim();
            const reason = document.getElementById('blacklistReason').value.trim();
            if (!ip) return alert('Introduceți un IP');
            const r = await fetch('/api/admin/blacklist/add', { method:'POST', headers:{ 'Content-Type':'application/json','x-admin-token': token }, body: JSON.stringify({ ip, reason }) });
            const data = await r.json();
            if (data.ok) { alert('IP blocat'); closeModal(); }
            else alert('Eroare: ' + (data.error || 'unknown'));
          });
          document.querySelectorAll('.remove-ip').forEach(btn => {
            btn.addEventListener('click', async ()=>{
              const ip = btn.getAttribute('data-ip');
              const r = await fetch('/api/admin/blacklist/remove', { method:'POST', headers:{ 'Content-Type':'application/json','x-admin-token': token }, body: JSON.stringify({ ip }) });
              const data = await r.json();
              if (data.ok) { alert('IP eliminat din blacklist'); closeModal(); }
              else alert('Eroare: ' + (data.error || 'unknown'));
            });
          });
        });

        // Announce (broadcast)
        const announceBtn = document.createElement('button'); announceBtn.className='button'; announceBtn.textContent='Trimite anunț';
        announceBtn.style.marginLeft='0.6rem';
        announceBtn.addEventListener('click', ()=>{
          const body = `<h3>Trimite anunț</h3><textarea id="announceText" style="width:100%;height:120px"></textarea><div style="text-align:right;margin-top:8px"><button id="doAnnounce" class="button">Trimite</button></div>`;
          openModal(body);
          // attach handler after content injected
          document.getElementById('doAnnounce').addEventListener('click', async ()=>{
            const text = document.getElementById('announceText').value;
            const r = await fetch('/api/admin/announce', { method:'POST', headers:{ 'Content-Type':'application/json','x-admin-token': token }, body: JSON.stringify({ text }) });
            const j = await r.json(); if (j.ok) { alert('Anunț trimis'); closeModal(); loadRequests(); } else alert('Eroare: '+j.error);
          });
        });
        document.querySelector('section:nth-of-type(3) div').appendChild(announceBtn);

        // load posts for admin
        async function loadPostsAdmin(){
          const r = await fetch('/api/admin/posts', { headers: { 'x-admin-token': token }});
          const j = await r.json(); const panel = document.getElementById('postsPanel');
          if (!j.ok) { panel.textContent='Eroare la mesaje'; return; }
          panel.innerHTML = '';
          j.posts.forEach(p=>{
            const el = document.createElement('div'); el.className='service-item'; el.style.marginBottom='0.6rem';
            el.innerHTML = `<div><strong>${p.author}${p.admin? ' (ADMIN)':''}</strong><div style="font-size:0.9rem;color:var(--muted)">${new Date(p.createdAt).toLocaleString()}</div><div style="margin-top:6px">${p.text}</div></div>`;
            const del = document.createElement('button'); del.className='button button-secondary'; del.textContent='Șterge';
            del.addEventListener('click', async ()=>{ if (!confirm('Ștergi acest mesaj?')) return; await fetch('/api/admin/delete-post',{ method:'POST', headers:{ 'Content-Type':'application/json','x-admin-token':token }, body: JSON.stringify({ id: p.id }) }); loadPostsAdmin(); });
            el.appendChild(del);
            panel.appendChild(el);
          });
        }

        // refresh both lists periodically
        setInterval(()=>{ loadRequests(); loadPostsAdmin(); }, 15000);
        loadPostsAdmin();

        document.getElementById('changePassBtn').addEventListener('click', ()=>{
          const body = `
            <h3>Schimbă parola</h3>
            <label>Parolă veche<input id="oldp" type="password" /></label>
            <label>Parolă nouă<input id="newp" type="password" /></label>
            <div style="margin-top:8px;text-align:right"><button id="doChange" class="button">Salvează</button></div>
          `;
          openModal(body);
          document.getElementById('doChange').addEventListener('click', async ()=>{
            const oldP = document.getElementById('oldp').value; const newP = document.getElementById('newp').value;
            const res = await fetch('/api/admin/change-pass',{ method:'POST', headers:{ 'Content-Type':'application/json','x-admin-token': token }, body: JSON.stringify({ oldPass: oldP, newPass: newP }) });
            const j = await res.json(); if (j.ok) { alert('Parolă schimbată'); closeModal(); } else alert('Eroare: '+j.error);
          });
        });

        loadRequests();
      })();
    </script>
  </body>
</html>
